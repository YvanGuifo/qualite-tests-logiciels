name: Deploy MkDocs

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-qualite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs Material and dependencies (versions compatibles)
        run: |
          pip install mkdocs-material==9.5.49
          pip install pymdown-extensions==10.14.3

      - name: Configurer Git pour gh-deploy
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Déployer sur gh-pages
        run: mkdocs gh-deploy --force